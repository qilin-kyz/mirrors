# KSAYA 发布流水线
#
# 触发方式：
#   1) 打 tag 推送：  git tag ksaya-v1.0 && git push origin ksaya-v1.0
#   2) 手动 workflow_dispatch（指定 tag 名）
#
# 做什么：真实构建 KSAYA 1.0 出厂安装 ISO，然后创建 GitHub Release 并把
# ISO 作为 Release 资产上传。Release 资产对公开仓库可匿名下载（无需 token），
# 所以下游取件不需要任何凭证。
#
# 认证：使用 GitHub Actions 内置的 GITHUB_TOKEN（permissions.contents: write），
# 不需要仓库里存任何 PAT。

name: KSAYA Release

on:
  push:
    tags:
      - "ksaya-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（例：ksaya-v1.0）"
        required: true
        default: "ksaya-v1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: 启用 flake
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

      - name: 构建 KSAYA 1.0 出厂安装 ISO
        working-directory: ksaya
        run: |
          set -o pipefail
          if ! nix build .#iso --accept-flake-config --print-out-paths 2>&1 | tee /tmp/iso-build.log; then
            MSG=$(tail -40 /tmp/iso-build.log | head -c 1800)
            MSG="${MSG//'%'/'%25'}"
            MSG="${MSG//$'\n'/'%0A'}"
            echo "::error::KSAYA ISO 构建失败:${MSG}"
            exit 1
          fi
          echo "=== ISO 产物 ==="
          ls -la result/iso/
          # result 是符号链接，上传前必须解引用到普通目录
          mkdir -p "$GITHUB_WORKSPACE/out"
          find -L result/ -name '*.iso' -type f -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          echo "=== 待发布 ISO ==="
          ls -lh "$GITHUB_WORKSPACE/out/"
          # 校验和统一在 DD 步骤最后生成（iso + img.gz 一起），这里不单独写，
          # 避免后面用 > 覆盖丢 ISO 条目。

      - name: 构建 KSAYA 1.0 出厂 DD 镜像（raw）
        working-directory: ksaya
        run: |
          set -o pipefail
          if ! nix build .#diskImage --accept-flake-config 2>&1 | tee /tmp/disk-build.log; then
            MSG=$(tail -40 /tmp/disk-build.log | head -c 1800)
            MSG="${MSG//'%'/'%25'}"
            MSG="${MSG//$'\n'/'%0A'}"
            MSG="${MSG//$'\r'/'%0D'}"
            echo "::error::KSAYA DD 镜像构建失败:${MSG}"
            exit 1
          fi
          echo "=== DD 镜像产物 ==="
          ls -lh result/
          # result 是符号链接，上传前必须 find -L 解引用到普通目录（与 ISO 同坑）。
          find -L result/ -name '*.img' -type f -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          # GitHub Release 单文件上限 2 GiB，raw 镜像（含预留余量）会超限。
          # 用 null 块稀疏 + gzip 压缩成 .img.gz（惰性删除未写区域 + zlib，压缩后 < 2 GiB）。
          echo "=== 压缩 DD 镜像为 img.gz（发布资产用）==="
          cd "$GITHUB_WORKSPACE/out"
          IMG="$(ls *.img | head -1)"
          ORIG_SHA="$(sha256sum "$IMG" | cut -d' ' -f1)"
          gzip -c "$IMG" > "${IMG}.gz"
          rm -f "$IMG"            # 只发压缩包，避免上传超 2 GiB 的 raw
          ls -lh
          echo "=== 生成校验和（iso + img.gz，附解压后 img 的 sha256）==="
          sha256sum "${IMG}.gz" > SHA256SUMS.txt
          echo "$ORIG_SHA  ${IMG}  (解压后)" >> SHA256SUMS.txt
          sha256sum *.iso >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: KSAYA 1.0
          body: |
            # KSAYA 1.0

            KSAYA 是一套面向异构、跨地域私有算力的集群系统：底层是可复现的 NixOS 系统镜像，
            上层是按「性能差距 / 带宽差距 / 地域差距」决策的分布式调度核心。

            > AR8 是 KSAYA 调度核心在 1.0 之前的代号；1.0 起统一以 KSAYA 命名。

            ## 本 Release 内容

            - `KSAYA-1.0.iso` —— 出厂安装盘：UEFI 引导，内置 flake 源码，离线可装；
            - `KSAYA-1.0.img.gz` —— 出厂 DD 镜像（gzip 压缩）：**已装好系统的整盘**，解压后
              `dd` 写入磁盘即可开机，无需交互装机；
            - `SHA256SUMS.txt` —— 各镜像与解压后文件的校验和。

            ## 两条装机路径

            ### 路径 A：ISO 交互装机

            1. 用 ISO 引导目标机（UEFI）；
            2. 执行 `ksaya-install /dev/<磁盘>`（GPT：ESP 1G + 根分区，按 label 挂载）；
            3. 写入完成后重启，系统以 `geo-distributed` profile 运行。

            ### 路径 B：DD 直接烧录（免装机）

            1. 解压并把 `KSAYA-1.0.img` 写到目标磁盘：

               Linux/macOS： `gzip -dk KSAYA-1.0.img.gz && dd if=KSAYA-1.0.img of=/dev/<整盘> bs=4M status=progress`
               Windows：     用 Rufus / balenaEtcher 直接写入 `.img.gz`。

            2. 目标机设为 UEFI 启动，开机即进入 KSAYA 1.0 系统（已预装好，无需再装机）。
               首启自动生成唯一 node-id 并向 collector 注册入群。

            ## 装出来的系统包含

            - 四 profile 可插拔调度（`nixos-baseline` / `xnu-qos` / `oh-distributed` / `geo-distributed`）；
            - 唯一节点标识 `/etc/ksaya/node-id` + 开机自动向 collector 注册入群；
            - `/etc/ksaya/version` = `1.0`；
            - 异构硬件宽口径 initrd（NVMe / SATA / USB / virtio / 常见有线网卡）。
          files: |
            out/*.iso
            out/*.img.gz
            out/SHA256SUMS.txt
          draft: false
          prerelease: false
