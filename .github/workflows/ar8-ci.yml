# ============================================================
#  AR8 四版本对照组 —— 云端验证流水线
#
#  三条独立 Job（并行）：
#    1) nix-verify   —— nix eval（13 个变体完整求值）+ nix build .#ar8（包自检）。
#    2) geo-sys      —— 第四方案落地：真实构建 geo-distributed 系统闭包 +
#                       从零构建可引导安装 ISO，产物上传 artifact 供下载。
#    3) bench-verify —— 纯 Python，实跑四版本基准（31 trials 配对检验）+ 单测。
#
#  触发：ar8-cluster/** 有改动、或本文件改动、或手动 workflow_dispatch。
#  说明：与 build-iso.yml（mirrors 宿主 ISO 构建）完全隔离，互不干扰。
# ============================================================

name: AR8 四版本验证

on:
  push:
    branches: [main]
    paths:
      - "ar8-cluster/**"
      - ".github/workflows/ar8-ci.yml"
  workflow_dispatch:       # 手动触发
    inputs:
      trials:
        description: "基准 trial 数（默认 31，快速验证可设 7）"
        required: false
        default: "31"

jobs:
  # ------------------------------------------------------------------
  # Job 1：Nix 侧真机构建验证（求值 + 包自检）
  # ------------------------------------------------------------------
  nix-verify:
    runs-on: ubuntu-latest       # x86_64-linux，与目标平台一致，无需交叉
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: 启用 flake
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

      # 13 个变体（3 host × 4 profile + geo 独立整机）完整求值：提前暴露
      # modules/*.nix 的语法/选项/类型错误。用 toplevel.drvPath 强制全量
      # 求值（惰性求值只查叶子属性会漏错）。
      # 注：ar8-cluster/flake.nix 的 nixpkgs.url 是官方 github:NixOS/nixpkgs/nixos-26.05，
      #     海外 CI 可直连；无 flake.lock 时 nix 会自动 fetch 并生成临时 lock。
      # 失败时必须把错误写进 ::error:: 注解 —— 公开仓库的注解无需登录即可经 API
      # 读取，这是无 admin 权限时拿到 nix 求值报错的唯一通道（mirrors/build-iso.yml
      # 同款做法）。否则错误只会进需要 admin 权限的 job 日志，外面看不到。
      - name: 校验 NixOS 变体可求值
        working-directory: ar8-cluster
        run: |
          set -o pipefail
          ok=1
          for c in vm-ar8-node1 vm-ar8-node1-xnu-qos \
                   vm-ar8-node1-oh-distributed vm-ar8-node1-geo-distributed \
                   vm-ar8-node2 vm-ar8-node2-xnu-qos \
                   vm-ar8-node2-oh-distributed vm-ar8-node2-geo-distributed \
                   001-thinkpad-x270 001-thinkpad-x270-xnu-qos \
                   001-thinkpad-x270-oh-distributed \
                   001-thinkpad-x270-geo-distributed \
                   ar8-geo-standalone ar8-1.0; do
            if ! nix eval --accept-flake-config --raw \
                 ".#nixosConfigurations.\"${c}\".config.system.build.toplevel.drvPath" \
                 2>&1 | tee /tmp/eval.log; then
              MSG=$(tail -40 /tmp/eval.log | head -c 1800)
              MSG="${MSG//'%'/'%25'}"
              MSG="${MSG//$'\n'/'%0A'}"
              MSG="${MSG//$'\r'/'%0D'}"
              echo "::error::变体 ${c} 求值失败:${MSG}"
              ok=0
              break
            fi
          done
          [ "$ok" = "1" ] && echo "变体完整求值通过（3 host × 4 profile + geo 独立整机 + 1.0 出厂整机）"

      - name: 构建 AR8 包（含 install 自检）
        working-directory: ar8-cluster
        run: |
          set -o pipefail
          if ! nix build .#ar8 --accept-flake-config 2>&1 | tee /tmp/build.log; then
            MSG=$(tail -30 /tmp/build.log | head -c 1800)
            MSG="${MSG//'%'/'%25'}"
            MSG="${MSG//$'\n'/'%0A'}"
            MSG="${MSG//$'\r'/'%0D'}"
            echo "::error::nix build .#ar8 失败:${MSG}"
            exit 1
          fi
          echo "=== AR8 包构建产物 ==="
          ls -R result/ 2>/dev/null | head -40
          echo "=== 包内自检：版本 + validate ==="
          AR8_CONFIG="$(pwd)/ar8-stable/ar8.config.yaml" \
          AR8_STATE_DIR="$(mktemp -d)" \
            ./result/bin/ar8ctl --version
          AR8_CONFIG="$(pwd)/ar8-stable/ar8.config.yaml" \
          AR8_STATE_DIR="$(mktemp -d)" \
            ./result/bin/ar8ctl validate

      - name: 上传 Nix 构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-log
          path: /tmp/build.log

  # ------------------------------------------------------------------
  # Job 2：AR8 1.0 出厂 —— 融合版系统闭包 + 出厂安装 ISO
  # ------------------------------------------------------------------
  geo-sys:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: 启用 flake
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

      # AR8 1.0 出厂（融合基础系统 × AR8）：真实构建 1.0 系统闭包。
      # 不只 eval —— 跑出完整 /nix/store/...-nixos-system，取证版本标识与 profile。
      - name: 构建 AR8 1.0 融合版系统闭包（toplevel）
        working-directory: ar8-cluster
        run: |
          set -o pipefail
          if ! nix build '.#nixosConfigurations."ar8-1.0".config.system.build.toplevel' \
               --accept-flake-config --print-out-paths 2>&1 | tee /tmp/ar810-build.log; then
            MSG=$(tail -40 /tmp/ar810-build.log | head -c 1800)
            MSG="${MSG//'%'/'%25'}"
            MSG="${MSG//$'\n'/'%0A'}"
            MSG="${MSG//$'\r'/'%0D'}"
            echo "::error::AR8 1.0 系统闭包构建失败:${MSG}"
            exit 1
          fi
          echo "=== AR8 1.0 系统闭包 ==="
          nix eval --accept-flake-config --raw \
            ".#nixosConfigurations.\"ar8-1.0\".config.services.ar8.systemProfile"
          echo "(期望 geo-distributed)"
          nix eval --accept-flake-config --raw \
            ".#ar8.version"
          echo "(期望 1.0)"

      - name: 上传 AR8 1.0 系统闭包构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar8-1.0-system-closure-log
          path: /tmp/ar810-build.log

      # AR8 1.0 出厂安装 ISO：一张盘装出 1.0 系统，flake 源码随盘离线可装。
      # 盘内入口 ar8-install /dev/<磁盘>，或 nixos-install --flake <path>#ar8-1.0。
      - name: 构建 AR8 1.0 出厂安装 ISO
        working-directory: ar8-cluster
        run: |
          set -o pipefail
          if ! nix build .#iso --accept-flake-config 2>&1 | tee /tmp/ar810-iso.log; then
            MSG=$(tail -40 /tmp/ar810-iso.log | head -c 1800)
            MSG="${MSG//'%'/'%25'}"
            MSG="${MSG//$'\n'/'%0A'}"
            MSG="${MSG//$'\r'/'%0D'}"
            echo "::error::AR8 1.0 ISO 构建失败:${MSG}"
            exit 1
          fi
          echo "=== ISO 产物 ==="
          ls -la result/iso/
          # result 是符号链接，upload-artifact@v4 默认不跟随符号链接，直接传
          # result/iso/*.iso 会 "No files were found"。这里 find -L 跟随链接，
          # 把真实 ISO 复制到工作区的普通目录，上传步骤从该目录取件。
          mkdir -p "$GITHUB_WORKSPACE/ar8-iso-out"
          find -L result/ -name '*.iso' -type f -exec cp {} "$GITHUB_WORKSPACE/ar8-iso-out/" \;
          echo "=== 待上传 ISO（解引用后）==="
          ls -lh "$GITHUB_WORKSPACE/ar8-iso-out/"

      - name: 上传 AR8 1.0 出厂 ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar8-1.0-installer-iso
          path: ar8-iso-out/*.iso
          if-no-files-found: error   # ISO 没产出就显式失败，不再静默漏传
          compression-level: 0   # ISO 已压缩，不再二次压缩

  # ------------------------------------------------------------------
  # Job 3：四版本基准 + 单测（纯 Python，独立于 Nix 构建）
  # ------------------------------------------------------------------
  bench-verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖（仅 PyYAML，标准库之外的最小依赖）
        run: pip install pyyaml

      - name: 63 单测（含 geo-distributed 正式 profile 语义断言 test_53~63）
        working-directory: ar8-cluster/ar8-stable
        run: python3 -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tail -40

      - name: 三版本基准（2 节点 31 trials，配对检验）
        working-directory: ar8-cluster/ar8-stable
        run: |
          TRIALS="${{ github.event.inputs.trials || '31' }}"
          python3 bench-profiles.py --shards 48 --trials "$TRIALS" \
            --seed 20261120 --nodes 2 --json bench-2node-dl.json
          echo "=== 配对显著性检验 ==="
          python3 bench-stats.py bench-2node-dl.json --metric makespan

      - name: 规模化 + 故障 + 数据本地性
        working-directory: ar8-cluster/ar8-stable
        run: |
          python3 bench-profiles.py --shards 48 --trials 31 --seed 20261120 \
            --nodes 8 --json bench-8node-dl.json
          python3 bench-profiles.py --shards 48 --trials 31 --seed 20261120 \
            --nodes 2 --failure --json bench-failure-dl.json
          python3 bench-sensitivity.py --trials 15 --homogeneous \
            --json bench-sensitivity-homo.json

      - name: 调度器 wall-clock 吞吐（单决策开销 + 端到端 + 节点规模退化）
        working-directory: ar8-cluster/ar8-stable
        run: |
          python3 bench-router-throughput.py --decisions 200000 --nodes 2 \
            --iters 5 --shards 48 --trials 50 --sweep-nodes 8 \
            --json bench-router-throughput.json

      - name: 三重差距基准（性能/带宽/地域，四方对照 + geo 矩阵重算）
        working-directory: ar8-cluster/ar8-stable
        run: |
          python3 bench-triple-gap.py --shards 48 --trials 31 --seed 20261120 \
            --json bench-triple-gap.json

      - name: 上传基准产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar8-bench-results
          path: |
            ar8-cluster/ar8-stable/bench-2node-dl.json
            ar8-cluster/ar8-stable/bench-8node-dl.json
            ar8-cluster/ar8-stable/bench-failure-dl.json
            ar8-cluster/ar8-stable/bench-sensitivity-homo.json
            ar8-cluster/ar8-stable/bench-router-throughput.json
            ar8-cluster/ar8-stable/bench-triple-gap.json