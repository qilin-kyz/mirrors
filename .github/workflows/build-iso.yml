# ============================================================
#  镜 · ISO 云端构建流水线
#  push 到 main 或手动触发 → GitHub x86_64 构建机出 ISO →
#  Actions 页面直接下载「镜-0.1-DEMO.iso」成品
#
#  注意：znver5 全量编译在 CI 上可能超过 6 小时限额。
#  若超时，把 hosts/mirrorhost/configuration.nix 里
#  gcc.arch 临时改为 "x86-64-v3"（用官方二进制缓存），
#  构建时间会从数小时降到 20-40 分钟；到真机后再改回 znver5
#  做一次 nixos-rebuild switch 即可换回极致优化内核。
# ============================================================

name: 构建镜-ISO

on:
  push:
    branches: [main]
  workflow_dispatch:   # 允许在 Actions 页面手动点按钮触发
    inputs:
      arch:
        description: "编译架构（v3=快速出盘走二进制缓存；znver5=极致优化全量编译）"
        required: true
        default: "x86-64-v3"
        type: choice
        options: ["x86-64-v3", "znver5"]

jobs:
  build-iso:
    runs-on: ubuntu-latest   # x86_64-linux，与目标平台一致，无需交叉
    permissions:
      contents: write        # 允许发布 Release（公开可下载 ISO）
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Nix
        uses: DeterminateSystems/nix-installer-action@main

      # ISO 只是系统的搬运工：默认 v3 快速出盘（二进制缓存，约 20-40 分钟）。
      # 装到 9600X 真机后把 gcc.arch 改回 znver5 做一次 nixos-rebuild switch，
      # 最终运行的系统仍是 100% znver5 极致优化，一克不少。
      # 想要"出生即极致"的 ISO：手动触发时选 znver5（全量编译数小时，可能需自托管 runner）。
      - name: 按档位切换编译架构
        run: |
          ARCH="${{ github.event.inputs.arch || 'x86-64-v3' }}"
          echo "构建架构档位: $ARCH"
          sed -i "s/gcc.arch = \"znver5\"/gcc.arch = \"$ARCH\"/" hosts/mirrorhost/configuration.nix
          sed -i "s/gcc.tune = \"znver5\"/gcc.tune = \"$ARCH\"/" hosts/mirrorhost/configuration.nix
          # 把档位改动提交，避免 nix eval/build 因"脏 git 树"报错（nix eval 对脏树较敏感）
          git config user.email "ci@mirroros.local"
          git config user.name  "MirrorOS CI"
          git add hosts/mirrorhost/configuration.nix
          git commit -m "ci: apply arch=$ARCH for this run" || echo "nothing to commit"

      # 宿主配置（mirrorhost）不被 ISO 构建覆盖，单独的求值校验能提前
      # 暴露 modules/*.nix 的语法/选项错误，避免把坏配置带进真机首次 switch。
      # 放在构建之前：若有错，几秒内就挂，不浪费 20+ 分钟构建时长。
      # 用 config.system.build.toplevel.drvPath 强制完整求值（只求值、不构建），
      # 触发所有模块的选项/类型检查，而非只查一个叶子属性（惰性求值会漏错）。
      - name: 校验宿主配置可求值（mirrorhost）
        run: |
          set -o pipefail
          if ! nix eval --accept-flake-config --raw .#nixosConfigurations.mirrorhost.config.system.build.toplevel.drvPath 2>&1 | tee /tmp/eval.log; then
            MSG=$(tail -40 /tmp/eval.log | head -c 1800)
            MSG="${MSG//'%'/'%25'}"
            MSG="${MSG//$'\n'/'%0A'}"
            MSG="${MSG//$'\r'/'%0D'}"
            echo "::error::宿主配置求值失败:$MSG"
            exit 1
          fi
          echo "mirrorhost 配置完整求值通过 ✅"

      # 失败时把错误尾部写进工作流注解（annotations），
      # 公开仓库的注解无需登录即可经 API 读取 —— 调试闭环自动化。
      - name: 构建 ISO（镜 0.1-DEMO）
        run: |
          set -o pipefail
          if ! nix build .#iso --accept-flake-config 2>&1 | tee /tmp/build.log; then
            MSG=$(tail -30 /tmp/build.log | head -c 1800)
            MSG="${MSG//'%'/'%25'}"
            MSG="${MSG//$'\n'/'%0A'}"
            MSG="${MSG//$'\r'/'%0D'}"
            echo "::error::$MSG"
            exit 1
          fi

      - name: 上传 ISO 产物
        uses: actions/upload-artifact@v4
        with:
          name: 镜-0.1-DEMO
          path: result/iso/*.iso
          compression-level: 0   # ISO 已压缩，不再二次压缩

      # 发布到 Release：公开、稳定 URL，免登录即可下载，也方便本机冒烟测试
      - name: 发布 ISO 到 Release（公开可下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 镜-0.1-DEMO
          name: 镜 0.1-DEMO
          files: result/iso/*.iso
          overwrite_files: true
          body: |
            自动构建 · NixOS 26.05 + Linux 6.18（官方二进制内核）。
            KVM/虚拟化运行期模块已启用，安装盘开箱即可虚拟化。
