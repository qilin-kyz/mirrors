# KSAYA —— 最简 S3 API（单实例 MinIO）
#
# 2026-11-18 用户裁决：删除 26 厂商兼容层 / 自研 SigV4 / 多副本反熵网关，
# 只保留一个最简单的 S3 API。将来接某个具体云资源时，为那个资源单独写接入代码。
#
# 形态：单 Deployment + PVC（local-path）+ ClusterIP Service。
# 端点与 ksaya.config.yaml features.s3.endpoint 一致：
#   http://ksaya-s3.ksaya-s3.svc.cluster.local:9000
#
# 镜像：minio/minio（经 registry mirror 拉取；若拉不动，参照 mc/build-mc-image.sh
#       的思路本地构建 OCI 导入，imagePullPolicy 改 Never）。
apiVersion: v1
kind: Namespace
metadata:
  name: ksaya-s3
  labels: { app: ksaya, component: s3 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ksaya-s3-data
  namespace: ksaya-s3
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksaya-s3
  namespace: ksaya-s3
  labels: { app: ksaya-s3 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ksaya-s3 }
  template:
    metadata:
      labels: { app: ksaya-s3 }
    spec:
      # local-path PVC 只在 node1 供给；钉住节点避免调度到 node2 后卷不可用
      nodeSelector:
        kubernetes.io/hostname: vm-ksaya-node1
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--address", ":9000"]
          env:
            - name: MINIO_ROOT_USER
              value: "ksayaadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "ksaya-secret-change-me"   # 测试凭据；生产改 Secret 注入
          ports:
            - name: s3
              containerPort: 9000
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ksaya-s3-data
---
apiVersion: v1
kind: Service
metadata:
  name: ksaya-s3
  namespace: ksaya-s3
spec:
  type: ClusterIP
  selector: { app: ksaya-s3 }
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
