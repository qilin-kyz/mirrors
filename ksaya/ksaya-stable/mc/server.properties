# KSAYA Minecraft 26.3 —— 容器内服务端配置
# 供 mc/build-mc-image.sh 打进镜像，或以 ConfigMap 挂载覆盖。
# 注意：容器内端口固定 25565（k8s Service 映射到 NodePort 30065）。

eula=true
server-port=25565

# 离线模式：集群内测试不需要微软账号认证
online-mode=false
white-list=false
enforce-whitelist=false

# 轻量：容器内存有限
gamemode=creative
difficulty=peaceful
max-players=10
view-distance=4
simulation-distance=4
spawn-protection=0

# 允许真实客户端连上来
network-compression-threshold=256
player-idle-timeout=0
prevent-proxy-connections=false
enable-status=true

# 不生成多余世界维度
allow-nether=false
allow-end=false
generate-structures=false
sync-chunk-writes=false

motd=§b§lKSAYA §7集群 · Minecraft 26.3 · k3s 工作负载
