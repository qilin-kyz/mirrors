<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>镜 · 管理台</title>
<style>
  /* 黑白单色：黑底白字灰辅，复古菜单气质不变 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#000; color:#ccc;
    font-family:"Courier New",ui-monospace,monospace; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  #bios {
    width:min(1100px,96vw); height:min(720px,94vh);
    background:#000; border:3px solid #ccc; outline:3px solid #333;
    display:flex; flex-direction:column; padding:6px 10px;
  }
  .titlebar { text-align:center; color:#fff; font-weight:bold; padding:4px 0; letter-spacing:2px; }
  .titlebar span { background:#000; color:#fff; padding:0 12px; }
  .menubar { display:flex; border-top:2px solid #ccc; border-bottom:2px solid #ccc; }
  .menubar .tab { padding:4px 18px; color:#ccc; cursor:pointer; user-select:none; background:#000; }
  .menubar .tab.active { background:#000; color:#fff; font-weight:bold; text-decoration:underline; text-underline-offset:4px; }
  .menubar .tab:hover:not(.active) { color:#fff; }
  #main { flex:1; display:flex; overflow:hidden; }
  #content { flex:1; padding:10px 14px; overflow:auto; }
  #help {
    width:280px; border-left:2px solid #ccc; padding:10px 12px;
    color:#999; font-size:13px; line-height:1.6; overflow:auto;
  }
  #help b { color:#fff; }
  .statusbar { border-top:2px solid #ccc; padding:4px 6px; font-size:13px; color:#fff; }
  .statusbar em { color:#fff; font-style:normal; border:1px solid #888; padding:0 4px; }

  table { border-collapse:collapse; width:100%; }
  td,th { padding:2px 8px; text-align:left; white-space:nowrap; }
  th { color:#fff; font-weight:normal; border-bottom:1px solid #555; }
  .run { color:#fff; font-weight:bold; }         /* 运行中：亮白加粗 */
  .run::before { content:"● "; }
  .stop { color:#666; }                          /* 停止：暗灰 */
  .stop::before { content:"○ "; }
  .idle { color:#999; }
  .section { color:#fff; font-weight:bold; margin:10px 0 4px; border-bottom:1px dashed #444; padding-bottom:2px; }
  .kv td:first-child { color:#999; width:220px; }
  .btn {
    display:inline-block; border:2px outset #ccc; background:#ccc; color:#000;
    padding:1px 14px; margin:2px 6px 2px 0; cursor:pointer; font-family:inherit; font-size:14px;
  }
  .btn:active { border-style:inset; }
  .btn.danger { background:#000; color:#fff; border:2px solid #fff; }
  .warn { color:#fff; } .ok { color:#fff; font-weight:bold; } .bad { color:#fff; background:#444; }
  pre { color:#ccc; font-size:13px; line-height:1.45; white-space:pre-wrap; }
  input,select {
    background:#000; color:#fff; border:2px inset #ccc;
    font-family:inherit; font-size:14px; padding:3px 8px; margin:2px 4px 2px 0;
  }
  input[type=checkbox]{ width:auto; }
  label { color:#999; }
  fieldset { border:1px solid #555; padding:10px 14px; margin-top:10px; }
  legend { color:#fff; padding:0 8px; }
  #login {
    position:fixed; inset:0; background:#000; display:flex;
    align-items:center; justify-content:center; z-index:9;
  }
  #loginbox { border:3px solid #ccc; outline:3px solid #333; padding:28px 40px; text-align:center; }
  #loginbox input { width:260px; text-align:center; font-size:16px; padding:6px 10px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#ccc; color:#000; padding:4px 20px; display:none; font-weight:bold; z-index:99; }
</style>
</head>
<body>

<div id="login">
  <div id="loginbox">
    <p style="color:#fff;margin-bottom:14px">镜 · 管理台 —— 口令校验</p>
    <input type="password" id="pw" placeholder="请输入口令" autofocus
           onkeydown="if(event.key==='Enter')doLogin()">
    <p style="margin-top:12px"><span class="btn" onclick="doLogin()">[ 进入 ]</span></p>
    <p id="loginerr" class="bad" style="margin-top:10px"></p>
  </div>
</div>

<div id="bios">
  <div class="titlebar"><span>镜 · 虚拟化宿主管理台 v1.2 — mirrorhost</span></div>
  <div class="menubar" id="menubar"></div>
  <div id="main">
    <div id="content"></div>
    <div id="help"></div>
  </div>
  <div class="statusbar">
    <em>F1</em> 帮助 &nbsp; <em>←→</em> 切换菜单 &nbsp; <em>回车</em> 确认 &nbsp;
    <em>F5</em> 刷新 &nbsp; <em>Esc</em> 退出登录 &nbsp;·&nbsp; 凡人触镜，镜必留痕
  </div>
</div>
<div id="toast"></div>

<script>
const TABS = ["总览","实例","镜像库","存储","快照","审计","电源"];
const HELP = {
  "总览":  "<b>系统总览</b><br>内核 6.18 LTS，znver5 全系统编译，9600X 专属定制内核。<br>CPU / GPU / 内存 / 磁盘实时状态与三栈健康度。",
  "实例":  "<b>实例全生命周期</b><br>三种引擎：<b>incus</b>、<b>qemu</b>、<b>docker</b>。<br><br>［新建］创建向导：<br>· qemu —— 从只读 ISO 库安装<br>· incus —— 从镜像启动，可挂 5070 Ti<br>· docker —— 用时拉取镜像即跑<br><br>［删除］销毁实例并释放其数据。",
  "镜像库":"<b>ISO 库（镜存）</b><br>虚拟机只能从只读 ISO U盘安装。<br>导入新镜像：先到「存储」页切读写模式，拷入后切回只读。",
  "存储":  "<b>硬盘 / U盘管理</b><br>256G 系统盘 · 1T 实例盘 · 32G ISO 盘。<br><b>影分身：</b>ISO 盘只读/读写双模式。读写模式的每一秒都是攻击面——镜痕在看着。",
  "快照":  "<b>镜中世界</b><br>快照只包含系统数据，绝不包含实例数据。<br>［封存］立即创建 · ［释放］删除。",
  "审计":  "<b>镜痕</b><br>一切命令与系统对命令的后续处理，全部写进系统日志。凡人触镜，镜必留痕。",
  "电源":  "<b>宿主电源</b><br>优雅重启 / 关机。<br>关机前会礼貌地先关闭所有实例（onShutdown=shutdown）。",
};
let curTab = "总览";
let ISOS = [];   // 缓存 ISO 列表供创建向导使用

const $ = id => document.getElementById(id);

// ---- 令牌认证：不依赖 Cookie（iframe/代理环境下 Cookie 会被拦）----
// localStorage 在沙箱 iframe 里也可能被禁，自动降级为内存存储
const store = (() => {
  try {
    localStorage.setItem("__mirror_probe", "1");
    localStorage.removeItem("__mirror_probe");
    return localStorage;
  } catch (e) {
    const m = {};
    return { getItem: k => (k in m ? m[k] : null),
             setItem: (k, v) => { m[k] = String(v); },
             removeItem: k => { delete m[k]; } };
  }
})();
function token() { return store.getItem("mirror_token") || ""; }

async function api(path, body) {
  const opt = {
    method: body ? "POST" : "GET",
    headers: {"Content-Type":"application/json", "X-Mirror-Token": token()},
  };
  if (body) opt.body = JSON.stringify(body);
  let r;
  try { r = await fetch(path, opt); }
  catch(e) { throw "连接失败：" + e.message; }
  if (r.status === 401) { $("login").style.display="flex"; throw "auth"; }
  return r.json();
}

function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.style.display="block";
  t.style.background = bad ? "#000" : "#ccc";
  t.style.color = bad ? "#fff" : "#000";
  if (bad) t.style.border = "2px solid #fff"; else t.style.border = "none";
  setTimeout(()=>t.style.display="none", 3500);
}

async function doLogin() {
  $("loginerr").textContent = "";
  let r;
  try {
    r = await fetch("/api/login", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:$("pw").value})});
  } catch(e) {
    $("loginerr").textContent = "连接失败 —— 管理台服务是否在运行？";
    return;
  }
  if (r.ok) {
    const j = await r.json();
    if (j.token) store.setItem("mirror_token", j.token);   // 主通道
    $("login").style.display = "none";
    render();
  } else {
    $("loginerr").textContent = "口令错误！";
  }
}

function logout() {
  store.removeItem("mirror_token");
  location.reload();
}

function stateCls(s){ return /run|up|active/i.test(s)?"run":(/stop|exit|shut/i.test(s)?"stop":"idle"); }
function stateZh(s){
  if (/running|up|active/i.test(s)) return "运行中";
  if (/stopped|exited|shut/i.test(s)) return "已停止";
  return s;
}
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function render() {
  $("menubar").innerHTML = TABS.map(t =>
    `<span class="tab ${t===curTab?'active':''}" onclick="curTab='${t}';render()">${t}</span>`).join("");
  $("help").innerHTML = HELP[curTab];
  const c = $("content"); c.innerHTML = "<p>加载中……</p>";
  try { c.innerHTML = await VIEWS[curTab](); }
  catch(e) { if(e!=="auth") c.innerHTML = "<p class='bad'>错误："+esc(e)+"</p>"; }
}

const VIEWS = {
  async "总览"() {
    const o = await api("/api/overview");
    return `<div class="section">系统信息</div><table class="kv">
      <tr><td>主机名</td><td>${esc(o.host)}</td></tr>
      <tr><td>内核</td><td>${esc(o.kernel)}</td></tr>
      <tr><td>运行时长</td><td>${esc(o.uptime)} &nbsp; 负载 ${esc(o.load||"")}</td></tr>
      <tr><td>处理器</td><td>${esc(o.cpu)}</td></tr>
      <tr><td>显卡</td><td>${esc(o.gpu)}</td></tr>
      ${o.mem?`<tr><td>内存</td><td>${esc(o.mem)}</td></tr>`:""}
      ${o.net?`<tr><td>网络</td><td>${esc(o.net)}</td></tr>`:""}
      ${o.disk?`<tr><td>磁盘占用</td><td><pre style="display:inline">${esc(o.disk)}</pre></td></tr>`:""}
      <tr><td>虚拟化引擎（三生镇魂）</td><td>${(o.engines||[]).map(e=>`<span class="ok">●</span> ${e}`).join(" &nbsp; ")}</td></tr>
    </table>
    <div class="section">安全姿态</div><table class="kv">
      <tr><td>更新通道</td><td>仅 NixOS 稳定分支 —— 禁止 unstable</td></tr>
      <tr><td>处理器优化</td><td>znver5 全系统编译 + 9600X 专属定制内核</td></tr>
      <tr><td>安装介质（镜存）</td><td>仅只读 U盘</td></tr>
      <tr><td>审计（镜痕）</td><td class="ok">auditd 全命令审计 + journald 持久化</td></tr>
      <tr><td>会话（镜言）</td><td>全系统单一 tmux 会话，任意入口可续</td></tr>
    </table>`;
  },

  async "实例"() {
    const [list, isos] = await Promise.all([api("/api/instances"), api("/api/isos")]);
    ISOS = isos;
    const rows = list.map(i => `<tr>
      <td>${esc(i.engine)}</td><td>${esc(i.name)}</td>
      <td class="${stateCls(i.state)}">${stateZh(i.state)}</td><td>${esc(i.info)}</td>
      <td><span class="btn" onclick="instAct('${i.engine}','${i.name}','start')">启动</span><span class="btn" onclick="instAct('${i.engine}','${i.name}','stop')">停止</span><span class="btn" onclick="instAct('${i.engine}','${i.name}','restart')">重启</span><span class="btn danger" onclick="instAct('${i.engine}','${i.name}','delete')">删除</span></td>
    </tr>`).join("");
    return `<div class="section">实例列表</div>` +
      (list.length ? `<table><tr><th>引擎</th><th>名称</th><th>状态</th><th>说明</th><th>操作</th></tr>${rows}</table>`
                   : "<p>暂无实例。镜面平静。</p>") +
      `<fieldset><legend>＋ 新建实例向导</legend>
        <label>引擎</label>
        <select id="nw-engine" onchange="wizardFields()">
          <option value="qemu">qemu —— 从 ISO 库安装（镜存）</option>
          <option value="incus">incus —— 从镜像启动</option>
          <option value="docker">docker —— 用时拉取镜像即跑</option>
        </select>
        <label>名称</label><input id="nw-name" size="18" placeholder="my-vm">
        <span id="nw-fields"></span>
        <p style="margin-top:8px"><span class="btn" onclick="createInstance()">[ 创建 ]</span></p>
      </fieldset>
      <p class="warn" style="margin-top:8px">「删除」会销毁实例并释放其数据。镜中没有撤销。</p>
      <script>wizardFields()<\/script>`;
  },

  async "镜像库"() {
    const isos = await api("/api/isos");
    return `<div class="section">ISO 镜像库 —— /var/lib/mirror/iso（只读 U盘）</div>` +
      (isos.length ? `<table><tr><th>镜像文件</th><th>大小 (MB)</th></tr>` +
        isos.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.size_mb}</td></tr>`).join("") + `</table>`
      : "<p>库中暂无镜像。请插入 32G ISO U盘。</p>") +
      `<p class="warn" style="margin-top:10px">安装介质只能来自此库。导入新镜像请先到「存储」页切换读写模式。</p>`;
  },

  async "存储"() {
    const s = await api("/api/storage");
    let html = "";
    if (s.disks) {
      html += `<table><tr><th>角色</th><th>设备</th><th>型号</th><th>挂载点</th><th>已用</th><th>模式</th></tr>` +
        s.disks.map(d=>`<tr><td>${esc(d.role)}</td><td>${esc(d.dev)}</td><td>${esc(d.model)}</td>
          <td>${esc(d.mount)}</td><td>${esc(d.used)}</td>
          <td class="${d.ro?'ok':''}">${d.ro?"只读":"读写"}</td></tr>`).join("") + `</table>`;
    } else {
      html += `<pre>${esc(s.raw||"无数据")}</pre>`;
    }
    html += `<div class="section">影分身 —— ISO 盘模式</div>
      <p>当前模式：<b>${(s.iso_mode||"?")==="ro"?"只读":"读写"}</b></p>
      <p style="margin-top:8px">
        <span class="btn" onclick="isoMode('ro')">[ 切回只读 ]</span>
        <span class="btn danger" onclick="isoMode('rw')">[ 切到读写 ]</span>
      </p>`;
    return html;
  },

  async "快照"() {
    const snaps = await api("/api/snapshots");
    return `<div class="section">镜中世界 —— 只含系统数据的快照（不含实例数据）</div>
      <p><span class="btn" onclick="snapCreate()">[ 封存新快照 ]</span></p>` +
      (snaps.length ? `<table><tr><th>归档文件</th><th>大小 (MB)</th><th>操作</th></tr>` +
        snaps.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.size_mb}</td>
          <td><span class="btn danger" onclick="snapDel('${s.name}')">释放</span></td></tr>`).join("") + `</table>`
      : "<p>尚未封存任何快照。</p>");
  },

  async "审计"() {
    const a = await api("/api/audit");
    return `<div class="section">镜痕 —— 最近的痕迹</div><pre>${esc(a.log)}</pre>`;
  },

  async "电源"() {
    return `<div class="section">宿主电源控制</div>
      <p class="warn">关机前会先优雅关闭所有实例（onShutdown=shutdown）。</p>
      <p style="margin-top:14px">
        <span class="btn" onclick="power('reboot')">[ 重启宿主 ]</span>
        <span class="btn danger" onclick="power('poweroff')">[ 关闭宿主 ]</span>
      </p>
      <div class="section">系统回滚</div>
      <p>系统级回滚请在控制台执行：<span class="ok">nixos-rebuild switch --rollback</span> ——
         每个世代都是原子的，每个错误都可逆。这就是镜夜里睡得着的原因。</p>`;
  },
};

// ---- 创建向导的动态字段 ----
function wizardFields() {
  const e = $("nw-engine").value;
  const isoOpts = ISOS.map(i=>`<option>${esc(i.name)}</option>`).join("");
  let html = "";
  if (e === "qemu") {
    html = `<br><label>ISO</label><select id="nw-iso">${isoOpts || "<option>（库中暂无镜像）</option>"}</select>
      <label>内存 MB</label><input id="nw-mem" size="6" value="4096">
      <label>vCPU</label><input id="nw-vcpu" size="3" value="4">
      <label>磁盘 GB</label><input id="nw-disk" size="4" value="64">`;
  } else if (e === "incus") {
    html = `<br><label>镜像</label><input id="nw-image" size="26" value="images:debian/13" placeholder="images:debian/13">
      <label><input type="checkbox" id="nw-gpu"> 挂载 5070 Ti 显卡</label>`;
  } else {
    html = `<br><label>镜像</label><input id="nw-image" size="26" placeholder="ollama/ollama:latest">
      <p class="warn">docker 用时才拉取镜像 —— 系统本身不携带任何镜像。</p>`;
  }
  $("nw-fields").innerHTML = html;
}

async function createInstance() {
  const engine = $("nw-engine").value;
  const spec = {engine, name: $("nw-name").value.trim()};
  if (!spec.name) { toast("请填写名称", true); return; }
  if (engine === "qemu") {
    spec.iso = $("nw-iso").value;
    spec.memory_mb = +$("nw-mem").value || 4096;
    spec.vcpus = +$("nw-vcpu").value || 4;
    spec.disk_gb = +$("nw-disk").value || 64;
  } else if (engine === "incus") {
    spec.image = $("nw-image").value.trim();
    spec.gpu = $("nw-gpu").checked;   // 5070 Ti 共享：仅此一处开口
  } else {
    spec.image = $("nw-image").value.trim();   // docker：纯拉取即跑，不碰显卡
  }
  toast("正在创建 " + spec.name + "……");
  try {
    const r = await api("/api/instance/create", spec);
    toast(r.message || (r.ok ? "已创建" : "失败"), !r.ok);
  } catch(e) { if (e !== "auth") toast(String(e), true); }
  render();
}

async function instAct(engine, name, action) {
  if (action==="delete" && !confirm(`删除 ${engine}/${name} 并释放其数据？`)) return;
  const r = await api("/api/instance/action", {engine, name, action});
  toast(r.message || (r.ok?"完成":"失败"), !r.ok); render();
}
async function isoMode(mode) {
  if (mode==="rw" && !confirm("将 ISO 盘切到读写模式？读写模式的每一秒都是攻击面。")) return;
  const r = await api("/api/storage/isomode", {mode});
  toast(r.message, !r.ok); render();
}
async function snapCreate() {
  toast("正在封存快照……（仅系统数据）");
  const r = await api("/api/snapshot/create", {});
  toast(r.message, !r.ok); render();
}
async function snapDel(name) {
  if (!confirm(`释放快照 ${name}？`)) return;
  const r = await api("/api/snapshot/delete", {name});
  toast(r.message, !r.ok); render();
}
async function power(what) {
  if (!confirm(what==="reboot" ? "确定重启宿主？" : "确定关闭宿主？")) return;
  const r = await api("/api/power", {what});
  toast(r.message, !r.ok);
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") logout();
  if (e.key === "F5") { e.preventDefault(); render(); }
  const i = TABS.indexOf(curTab);
  if (e.key === "F1") { e.preventDefault(); alert("镜 · 管理台\n\n←→ 切换菜单，回车确认。\n你所做的一切都会写进镜痕。"); }
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") { curTab = TABS[(i+1)%TABS.length]; render(); }
  if (e.key === "ArrowLeft")  { curTab = TABS[(i-1+TABS.length)%TABS.length]; render(); }
});

// 已有令牌则直接进，否则停在口令页
if (token()) { $("login").style.display = "none"; }

// 启动自检：确认页面由 mirror-webui 服务提供。
// 静态副本/错误源（API 不存在）会在口令框直接给出指引。
(async () => {
  try {
    const r = await fetch("/api/overview", {headers: {"X-Mirror-Token": token()}});
    if (r.status !== 401 && !r.ok) throw new Error("bad origin");
  } catch (e) {
    $("loginerr").innerHTML =
      "此页面是静态副本，接口不可达。<br>请通过管理台地址访问：<b>http://&lt;主机&gt;:8443</b>";
  }
})();

render();
</script>
</body>
</html>
