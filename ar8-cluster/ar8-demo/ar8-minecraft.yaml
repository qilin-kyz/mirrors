# AR8 Minecraft —— 集群内运行（真实负载测试）
#
# 定位：这不是「把游戏装在集群里的一台机器上」的裸机部署，
#       而是把 MC 26.3 作为 **k8s 工作负载** 跑起来，用来验证：
#         1) 集群能调度一个长驻有状态服务（StatefulSet + PVC）
#         2) 集群能承载真实、持续、有网络交互的负载（不是 echo/探针）
#         3) 集群的带宽策略能对一个真实长连接生效
#
# 镜像：ar8.local/minecraft:26.3（本地构建，见 mc/build-mc-image.sh）
#       不依赖任何外部镜像源（国内 docker.io 大镜像不可达）
#
# 端口：容器内 25565，用 NodePort 30065 对外暴露
#
# 带宽策略：AR8 调度侧按 tier 分配 tc 限额；本清单只声明 tier，
#           实际 tc 规则由 ar8ctl 下发到节点网卡。
apiVersion: v1
kind: Namespace
metadata:
  name: ar8-mc
  labels:
    ar8.io/workload: "minecraft"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ar8-mc-world
  namespace: ar8-mc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ar8-mc
  namespace: ar8-mc
  labels:
    app: ar8-mc
    ar8.io/workload: "minecraft"
spec:
  serviceName: ar8-mc
  replicas: 1
  selector:
    matchLabels:
      app: ar8-mc
  template:
    metadata:
      labels:
        app: ar8-mc
        ar8.io/workload: "minecraft"
      annotations:
        # 调度侧据此档位下发 tc 带宽规则；见 ar8.config.yaml features.bandwidth
        ar8.io/bandwidth-tier: "streaming"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: minecraft
          image: ar8.local/minecraft:26.3
          imagePullPolicy: Never
          command: ["/opt/mc/start.sh"]
          ports:
            - name: mc
              containerPort: 25565
          env:
            - name: EULA
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "1400Mi"
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: world
              mountPath: /opt/mc/world
            - name: data
              mountPath: /opt/mc/data
      volumes:
        - name: world
          persistentVolumeClaim:
            claimName: ar8-mc-world
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ar8-mc
  namespace: ar8-mc
spec:
  type: NodePort
  selector:
    app: ar8-mc
  ports:
    - name: mc
      port: 25565
      targetPort: 25565
      nodePort: 30065
